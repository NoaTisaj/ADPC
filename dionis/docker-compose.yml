services:
  mongo:
    image: mongo:8
    container_name: dionis-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - dionis_mongo_data:/data/db

  minio:
    image: minio/minio:latest
    container_name: dionis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dionis
      MINIO_ROOT_PASSWORD: dionis_dev_pass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dionis_minio_data:/data

volumes:
  dionis_mongo_data:
  dionis_minio_data:
